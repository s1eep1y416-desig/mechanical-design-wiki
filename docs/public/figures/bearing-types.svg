 </style><rect width="1000" height="600" rx="16" fill="#fff"/><text x="40" y="30" class="eyebrow" text-anchor="start">MECHANICAL DESIGN · 35 / ENGINEERING FIGURE</text><text x="40" y="70" class="title" text-anchor="start">四种滚动轴承的承载结构</text><rect x="45" y="110" width="225" height="385" rx="12" class="panel"></rect><text x="65" y="140" class="subtitle" text-anchor="start">深沟球轴承</text><rect x="95" y="215" width="140" height="25" rx="3" class="hatch"></rect><rect x="95" y="325" width="140" height="25" rx="3" class="hatch"></rect><rect x="95" y="275" width="140" height="15" rx="3" class="hatch2"></rect><circle cx="165" cy="255" r="21" class="ball"></circle><circle cx="165" cy="307" r="21" class="ball"></circle><text x="63" y="410" class="small" text-anchor="start">以径向载荷为主</text><text x="63" y="440" class="small" text-anchor="start">可承受一定轴向载荷</text><rect x="285" y="110" width="225" height="385" rx="12" class="panel"></rect><text x="305" y="140" class="subtitle" text-anchor="start">圆柱滚子轴承</text><rect x="335" y="215" width="140" height="25" rx="3" class="hatch"></rect><rect x="335" y="325" width="140" height="25" rx="3" class="hatch"></rect><rect x="335" y="275" width="140" height="15" rx="3" class="hatch2"></rect><path d="M375 240h60v35h-60Z M375 290h60v35h-60Z" class="steel"></path><text x="303" y="410" class="small" text-anchor="start">径向承载能力较高</text><text x="303" y="440" class="small" text-anchor="start">轴向能力取决于挡边</text><rect x="525" y="110" width="225" height="385" rx="12" class="panel"></rect><text x="545" y="140" class="subtitle" text-anchor="start">角接触球轴承</text><rect x="575" y="215" width="140" height="25" rx="3" class="hatch"></rect><rect x="575" y="325" width="140" height="25" rx="3" class="hatch"></rect><rect x="575" y="275" width="140" height="15" rx="3" class="hatch2"></rect><circle cx="645" cy="255" r="21" class="ball"></circle><circle cx="645" cy="307" r="21" class="ball"></circle><line x1="590" y1="360" x2="695" y2="200" class="force"></line><text x="543" y="410" class="small" text-anchor="start">径向＋单向轴向</text><text x="543" y="440" class="small" text-anchor="start">压力线倾斜</text><rect x="765" y="110" width="225" height="385" rx="12" class="panel"></rect><text x="785" y="140" class="subtitle" text-anchor="start">圆锥滚子轴承</text><rect x="815" y="215" width="140" height="25" rx="3" class="hatch"></rect><rect x="815" y="325" width="140" height="25" rx="3" class="hatch"></rect><rect x="815" y="275" width="140" height="15" rx="3" class="hatch2"></rect><path d="M855 240l65 10v25l-65 -10Z M855 300l65 -10v25l-65 10Z" class="steel"></path><line x1="830" y1="360" x2="935" y2="200" class="force"></line><text x="783" y="410" class="small" text-anchor="start">径向＋单向轴向</text><text x="783" y="440" class="small" text-anchor="start">滚子为截锥形</text><line x1="40" y1="550" x2="960" y2="550" class="guide"></line><text x="40" y="580" class="footer" text-anchor="start">独立绘制 · 教学示意 · 细节与比例以图下注释为准</text><text x="960" y="580" class="footer" text-anchor="end">bearing-types</text></svg>
