 </style><rect width="1000" height="600" rx="16" fill="#fff"/><text x="40" y="30" class="eyebrow" text-anchor="start">MECHANICAL DESIGN · 23 / ENGINEERING FIGURE</text><text x="40" y="70" class="title" text-anchor="start">V带与轮槽的工作接触面</text><path d="M160 160H290L355 360H445L510 160H640V440H160Z" class="hatch"></path><path d="M302 180H498L449 330H351Z" class="dark"></path><line x1="302" y1="180" x2="351" y2="330" class="contact"></line><line x1="498" y1="180" x2="449" y2="330" class="contact"></line><line x1="210" y1="240" x2="330" y2="270" class="force" marker-end="url(#arrow)"></line><text x="279" y="245" class="small" text-anchor="start">法向力</text><line x1="590" y1="240" x2="470" y2="270" class="force" marker-end="url(#arrow)"></line><text x="539" y="245" class="small" text-anchor="start">法向力</text><line x1="575" y1="330" x2="575" y2="360" class="dimension" marker-start="url(#dim)" marker-end="url(#dim)"></line><text x="575" y="335" class="small" text-anchor="middle">底隙</text><circle cx="355" cy="330" r="3" class="red"></circle><path d="M355 330L690 340h16" class="guide"></path><text x="710" y="345" class="small" text-anchor="start">带底悬空</text><circle cx="480" cy="235" r="3" class="red"></circle><path d="M480 235L690 180h16" class="guide"></path><text x="710" y="185" class="small" text-anchor="start">侧面接触工作</text><text x="200" y="485" class="small" text-anchor="start">楔紧作用提高摩擦能力；磨损后不能让带底落到槽底。</text><line x1="40" y1="550" x2="960" y2="550" class="guide"></line><text x="40" y="580" class="footer" text-anchor="start">独立绘制 · 教学示意 · 细节与比例以图下注释为准</text><text x="960" y="580" class="footer" text-anchor="end">v-belt-section</text></svg>
