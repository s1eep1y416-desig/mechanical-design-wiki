<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="轴的支反力与弯矩图解"><title>轴的支反力与弯矩图解</title><style>:root{--vp-c-text-1:#203b50;--vp-c-text-2:#526879;--vp-c-text-3:#647b8e;--vp-c-bg:#fff;--vp-c-bg-soft:#f3f7fa;--vp-c-divider:#dbe5ed;--vp-c-brand-1:#176cc4;--vp-c-brand-soft:#dfeaf6;--vp-font-family-base:'PingFang SC','Microsoft YaHei',sans-serif;--vp-font-family-mono:ui-monospace,monospace;color:#203b50} .force-diagram { --ft: #176cc4; --fr: #b06b0c; --fa: #8353c8; margin: 28px 0; padding: 22px; border: 1px solid var(--vp-c-divider); border-radius: 14px; background: var(--vp-c-bg-soft); }

header > span { color: var(--vp-c-text-3); font: 10px var(--vp-font-family-mono); letter-spacing: .12em; }
.force-diagram header h4 { margin: 6px 0 12px; font-size: 17px; line-height: 1.6; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--vp-c-text-1); font: 15px var(--vp-font-family-base); }
svg .small { fill: var(--vp-c-text-2); font-size: 12px; }
svg .panel-title { font-size: 13px; font-weight: 600; }
.body { fill: var(--vp-c-bg); stroke: var(--vp-c-text-3); stroke-width: 1.3; }
.structure { fill: none; stroke: var(--vp-c-text-3); stroke-width: 1.4; }
.axis, .guide { fill: none; stroke: var(--vp-c-text-3); stroke-width: 1; }
.guide { stroke-dasharray: 5 5; opacity: .7; }
.axis { stroke-dasharray: 10 4 2 4; }
.tangent, .radial, .axial, .normal { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.tangent { stroke: var(--ft); }.radial { stroke: var(--fr); }.axial { stroke: var(--fa); }.normal { stroke: var(--vp-c-text-1); }
.arrow-t, svg .text-t { fill: var(--ft); }.arrow-r, svg .text-r { fill: var(--fr); }.arrow-a, svg .text-a { fill: var(--fa); }.arrow-n, .point { fill: var(--vp-c-text-1); }
.shaft-line { stroke: var(--vp-c-text-2); stroke-width: 7; stroke-linecap: round; }
.moment-area { fill: var(--vp-c-brand-soft); stroke: var(--vp-c-divider); }
.force-relation { padding: 13px 16px; border-radius: 8px; background: var(--vp-c-bg); color: var(--vp-c-brand-1); font: 600 13px/1.9 var(--vp-font-family-mono); }
.force-diagram ol { padding-left: 22px; margin: 16px 0 12px; font-size: 13px; line-height: 1.9; }
.force-diagram li + li { margin-top: 4px; }
figcaption { border-top: 1px solid var(--vp-c-divider); padding-top: 12px; color: var(--vp-c-text-3); font-size: 11px; line-height: 1.8; }
svg text{font-family:'PingFang SC','Microsoft YaHei',sans-serif} .asset-title{font-size:27px;font-weight:700;fill:#203b50}.asset-footer{font-size:15px;fill:#526879}</style><rect width="1000" height="600" rx="16" fill="white"/><text x="40" y="65" class="asset-title">轴的支反力与弯矩图解</text><g class="force-diagram" transform="translate(104 110) scale(1.1)"><title id="force-v-0-title">轴的受力简图：先求支反力，再画弯矩</title><desc id="force-v-0-desc">将轴承简化为 A、B 两个支点，将齿轮的某一横向分力记作 F。 由 ΣF = 0 和 ΣM = 0 求支反力；图中只分析一个弯曲平面。 另一个平面同样计算，随后合成弯矩 M = √(My² + Mz²)，并单独处理转矩与轴向力。 单个集中横向载荷作用于两支点之间的简支梁模型。a、b 为集中力到左右支点的距离。</desc><defs><!--[--><marker id="force-v-0-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-t"></path></marker><marker id="force-v-0-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-r"></path></marker><marker id="force-v-0-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-a"></path></marker><marker id="force-v-0-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-n"></path></marker><!--]--></defs><!--[--><text x="62" y="32" class="panel-title">① 一个弯曲平面内的受力</text><path d="M83 164H637" class="shaft-line"></path><path d="M120 168l-14 22h28ZM590 168l-14 22h28Z" class="body"></path><path d="M103 195H137M573 195H607" class="structure"></path><path d="M330 75V164" class="tangent" marker-end="url(#force-v-0-t)"></path><path d="M120 252V164M590 252V164" class="radial" marker-end="url(#force-v-0-r)"></path><text x="342" y="98" class="text-t">F</text><text x="83" y="232" class="text-r">Rₐ</text><text x="602" y="232" class="text-r">Rᵦ</text><text x="109" y="151">A</text><text x="579" y="151">B</text><text x="339" y="151">P</text><path d="M120 98V123M330 98V123M590 98V123M120 115H590" class="guide"></path><text x="222" y="105" class="small">a</text><text x="455" y="105" class="small">b</text><text x="62" y="298" class="panel-title">② 弯矩大小图</text><path d="M120 352H590L330 287Z" class="moment-area"></path><path d="M120 352 330 287 590 352" class="normal"></path><text x="343" y="289" class="small">Mₚ = F·a·b / L</text><text x="102" y="371" class="small">0</text><text x="585" y="371" class="small">0</text><!--]--></g><text x="40" y="575" class="asset-footer">教学示意 · 请结合对应章节中的模型假设、单位与适用条件阅读</text></svg>
