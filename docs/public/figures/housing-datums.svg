 </style><rect width="1000" height="600" rx="16" fill="#fff"/><text x="40" y="30" class="eyebrow" text-anchor="start">MECHANICAL DESIGN · 46 / ENGINEERING FIGURE</text><text x="40" y="70" class="title" text-anchor="start">箱体基准与同轴镗孔</text><rect x="150" y="160" width="650" height="250" rx="3" class="hatch"></rect><rect x="190" y="200" width="570" height="165" rx="3" class="paper"></rect><circle cx="240" cy="285" r="70" class="steel"></circle><circle cx="240" cy="285" r="45" class="paper"></circle><circle cx="690" cy="285" r="70" class="steel"></circle><circle cx="690" cy="285" r="45" class="paper"></circle><rect x="80" y="274" width="820" height="22" rx="3" class="gold"></rect><line x1="65" y1="285" x2="925" y2="285" class="axis"></line><rect x="120" y="420" width="710" height="25" rx="3" class="metal"></rect><text x="130" y="470" class="small" text-anchor="start">基准 A：安装底面</text><line x1="345" y1="485" x2="345" y2="447" class="force" marker-end="url(#arrow)"></line><circle cx="520" cy="280" r="3" class="red"></circle><path d="M520 280L540 120h16" class="guide"></path><text x="560" y="125" class="small" text-anchor="start">镗杆与两端座孔同轴</text><text x="290" y="360" class="small" text-anchor="start">合箱后加工；剖分面按定位要求装配</text><line x1="40" y1="550" x2="960" y2="550" class="guide"></line><text x="40" y="580" class="footer" text-anchor="start">独立绘制 · 教学示意 · 细节与比例以图下注释为准</text><text x="960" y="580" class="footer" text-anchor="end">housing-datums</text></svg>
