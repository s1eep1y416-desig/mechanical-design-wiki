<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="带传动图解"><title>带传动图解</title><style>:root{--vp-c-text-1:#203b50;--vp-c-text-2:#526879;--vp-c-text-3:#647b8e;--vp-c-bg:#fff;--vp-c-bg-soft:#f3f7fa;--vp-c-divider:#dbe5ed;--vp-c-brand-1:#176cc4;--vp-c-brand-soft:#dfeaf6;--vp-font-family-base:'PingFang SC','Microsoft YaHei',sans-serif;--vp-font-family-mono:ui-monospace,monospace;color:#203b50} .force-diagram { --ft: #176cc4; --fr: #b06b0c; --fa: #8353c8; margin: 28px 0; padding: 22px; border: 1px solid var(--vp-c-divider); border-radius: 14px; background: var(--vp-c-bg-soft); }

header > span { color: var(--vp-c-text-3); font: 10px var(--vp-font-family-mono); letter-spacing: .12em; }
.force-diagram header h4 { margin: 6px 0 12px; font-size: 17px; line-height: 1.6; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--vp-c-text-1); font: 15px var(--vp-font-family-base); }
svg .small { fill: var(--vp-c-text-2); font-size: 12px; }
svg .panel-title { font-size: 13px; font-weight: 600; }
.body { fill: var(--vp-c-bg); stroke: var(--vp-c-text-3); stroke-width: 1.3; }
.structure { fill: none; stroke: var(--vp-c-text-3); stroke-width: 1.4; }
.axis, .guide { fill: none; stroke: var(--vp-c-text-3); stroke-width: 1; }
.guide { stroke-dasharray: 5 5; opacity: .7; }
.axis { stroke-dasharray: 10 4 2 4; }
.tangent, .radial, .axial, .normal { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.tangent { stroke: var(--ft); }.radial { stroke: var(--fr); }.axial { stroke: var(--fa); }.normal { stroke: var(--vp-c-text-1); }
.arrow-t, svg .text-t { fill: var(--ft); }.arrow-r, svg .text-r { fill: var(--fr); }.arrow-a, svg .text-a { fill: var(--fa); }.arrow-n, .point { fill: var(--vp-c-text-1); }
.shaft-line { stroke: var(--vp-c-text-2); stroke-width: 7; stroke-linecap: round; }
.moment-area { fill: var(--vp-c-brand-soft); stroke: var(--vp-c-divider); }
.force-relation { padding: 13px 16px; border-radius: 8px; background: var(--vp-c-bg); color: var(--vp-c-brand-1); font: 600 13px/1.9 var(--vp-font-family-mono); }
.force-diagram ol { padding-left: 22px; margin: 16px 0 12px; font-size: 13px; line-height: 1.9; }
.force-diagram li + li { margin-top: 4px; }
figcaption { border-top: 1px solid var(--vp-c-divider); padding-top: 12px; color: var(--vp-c-text-3); font-size: 11px; line-height: 1.8; }
svg text{font-family:'PingFang SC','Microsoft YaHei',sans-serif} .asset-title{font-size:27px;font-weight:700;fill:#203b50}.asset-footer{font-size:15px;fill:#526879}</style><rect width="1000" height="600" rx="16" fill="white"/><text x="40" y="65" class="asset-title">带传动图解</text><g class="force-diagram" transform="translate(104 110) scale(1.1)"><title id="force-v-0-title">带轮：传递转矩看拉力差，轴的载荷看矢量和</title><desc id="force-v-0-desc">图示为顺时针主动轮，下边为紧边，上边为松边。 带只能拉带轮，两条带边对带轮的拉力都指向右侧。 紧边与松边的力矩方向相反；支承反力 R 平衡两者的合力。 平行带边的简化模型，忽略离心力等影响。R = F₁ + F₂ 只适用于图示平行方向；一般情况应作矢量合成。</desc><defs><!--[--><marker id="force-v-0-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-t"></path></marker><marker id="force-v-0-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-r"></path></marker><marker id="force-v-0-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-a"></path></marker><marker id="force-v-0-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-n"></path></marker><!--]--></defs><!--[--><text x="64" y="32" class="panel-title">① 主动轮的受力简图</text><circle cx="160" cy="185" r="78" class="body"></circle><circle cx="160" cy="185" r="20" class="body"></circle><path d="M160 107H358M160 263H358" class="structure"></path><path d="M160 107H238" class="tangent" marker-end="url(#force-v-0-t)"></path><path d="M160 263H302" class="tangent" marker-end="url(#force-v-0-t)"></path><path d="M160 185H50" class="radial" marker-end="url(#force-v-0-r)"></path><path d="M109 91A105 105 0 0 1 193 86" class="normal" marker-end="url(#force-v-0-n)"></path><text x="127" y="65">n ↻</text><text x="258" y="98" class="text-t">F₂ · 松边</text><text x="257" y="287" class="text-t">F₁ · 紧边</text><text x="57" y="171" class="text-r">R</text><text x="62" y="332" class="small">R：轴对轮的支承反力</text><text x="422" y="32" class="panel-title">② 拉力差与拉力和</text><path d="M432 126H642" class="tangent" marker-end="url(#force-v-0-t)"></path><text x="448" y="110" class="text-t">紧边 F₁</text><path d="M432 202H518" class="tangent" marker-end="url(#force-v-0-t)"></path><text x="448" y="186" class="text-t">松边 F₂</text><text x="424" y="269">传矩：F₁ − F₂</text><text x="424" y="300">轴载荷：两边拉力的矢量和</text><text x="424" y="332" class="small">箭头长度仅示意大小关系</text><!--]--></g><text x="40" y="575" class="asset-footer">教学示意 · 请结合对应章节中的模型假设、单位与适用条件阅读</text></svg>
