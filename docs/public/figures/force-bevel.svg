<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="锥齿轮受力图解"><title>锥齿轮受力图解</title><style>:root{--vp-c-text-1:#203b50;--vp-c-text-2:#526879;--vp-c-text-3:#647b8e;--vp-c-bg:#fff;--vp-c-bg-soft:#f3f7fa;--vp-c-divider:#dbe5ed;--vp-c-brand-1:#176cc4;--vp-c-brand-soft:#dfeaf6;--vp-font-family-base:'PingFang SC','Microsoft YaHei',sans-serif;--vp-font-family-mono:ui-monospace,monospace;color:#203b50} .force-diagram { --ft: #176cc4; --fr: #b06b0c; --fa: #8353c8; margin: 28px 0; padding: 22px; border: 1px solid var(--vp-c-divider); border-radius: 14px; background: var(--vp-c-bg-soft); }

header > span { color: var(--vp-c-text-3); font: 10px var(--vp-font-family-mono); letter-spacing: .12em; }
.force-diagram header h4 { margin: 6px 0 12px; font-size: 17px; line-height: 1.6; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--vp-c-text-1); font: 15px var(--vp-font-family-base); }
svg .small { fill: var(--vp-c-text-2); font-size: 12px; }
svg .panel-title { font-size: 13px; font-weight: 600; }
.body { fill: var(--vp-c-bg); stroke: var(--vp-c-text-3); stroke-width: 1.3; }
.structure { fill: none; stroke: var(--vp-c-text-3); stroke-width: 1.4; }
.axis, .guide { fill: none; stroke: var(--vp-c-text-3); stroke-width: 1; }
.guide { stroke-dasharray: 5 5; opacity: .7; }
.axis { stroke-dasharray: 10 4 2 4; }
.tangent, .radial, .axial, .normal { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.tangent { stroke: var(--ft); }.radial { stroke: var(--fr); }.axial { stroke: var(--fa); }.normal { stroke: var(--vp-c-text-1); }
.arrow-t, svg .text-t { fill: var(--ft); }.arrow-r, svg .text-r { fill: var(--fr); }.arrow-a, svg .text-a { fill: var(--fa); }.arrow-n, .point { fill: var(--vp-c-text-1); }
.shaft-line { stroke: var(--vp-c-text-2); stroke-width: 7; stroke-linecap: round; }
.moment-area { fill: var(--vp-c-brand-soft); stroke: var(--vp-c-divider); }
.force-relation { padding: 13px 16px; border-radius: 8px; background: var(--vp-c-bg); color: var(--vp-c-brand-1); font: 600 13px/1.9 var(--vp-font-family-mono); }
.force-diagram ol { padding-left: 22px; margin: 16px 0 12px; font-size: 13px; line-height: 1.9; }
.force-diagram li + li { margin-top: 4px; }
figcaption { border-top: 1px solid var(--vp-c-divider); padding-top: 12px; color: var(--vp-c-text-3); font-size: 11px; line-height: 1.8; }
svg text{font-family:'PingFang SC','Microsoft YaHei',sans-serif} .asset-title{font-size:27px;font-weight:700;fill:#203b50}.asset-footer{font-size:15px;fill:#526879}</style><rect width="1000" height="600" rx="16" fill="white"/><text x="40" y="65" class="asset-title">锥齿轮受力图解</text><g class="force-diagram" transform="translate(104 110) scale(1.1)"><title id="force-v-0-title">直齿锥齿轮：分离力在轴向和径向上再分解</title><desc id="force-v-0-desc">在齿宽中点 P 处取力，左图为通过轴线的剖面。 Fₜ 垂直此剖面；剖面内分离力 F′ = Fₜ tan α。 将 F′ 分解：Fᵣ 指向轴线，Fₐ 沿轴线背离锥顶。 外啮合直齿锥齿轮、忽略摩擦；δ 为分锥角。图形只画分锥及分力，不是实体齿形。</desc><defs><!--[--><marker id="force-v-0-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-t"></path></marker><marker id="force-v-0-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-r"></path></marker><marker id="force-v-0-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-a"></path></marker><marker id="force-v-0-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-n"></path></marker><!--]--></defs><!--[--><text x="60" y="32" class="panel-title">① 轴向剖面与齿宽中点 P</text><path d="M78 223 348 125V321Z" class="body"></path><path d="M45 223H390" class="axis"></path><text x="45" y="249" class="small">锥顶</text><text x="358" y="244" class="small">轴线</text><circle cx="270" cy="153" r="9" class="tangent"></circle><circle cx="270" cy="153" r="2.5" class="arrow-t"></circle><path d="M270 153V233" class="radial" marker-end="url(#force-v-0-r)"></path><path d="M270 153H299.1" class="axial" marker-end="url(#force-v-0-a)"></path><path d="M270 153 299.1 233" class="normal" marker-end="url(#force-v-0-n)"></path><text x="246" y="135" class="text-t">Fₜ ⊙</text><text x="248" y="209" class="text-r">Fᵣ</text><text x="301" y="147" class="text-a">Fₐ</text><text x="308" y="219">F′</text><path d="M137 223A59 59 0 0 0 133.5 203" class="axis"></path><text x="144" y="214" class="small">δ</text><text x="60" y="350" class="small">径向分力指向轴线 · 轴向分力背离锥顶</text><text x="445" y="32" class="panel-title">② 剖面内分力</text><path d="M495 120V270" class="radial" marker-end="url(#force-v-0-r)"></path><path d="M495 120H549.6" class="axial" marker-end="url(#force-v-0-a)"></path><path d="M495 120 549.6 270" class="normal" marker-end="url(#force-v-0-n)"></path><path d="M549.6 120V270H495" class="guide"></path><path d="M495 162A42 42 0 0 0 509.4 159.5" class="axis"></path><text x="508" y="182" class="small">δ</text><text x="468" y="215" class="text-r">Fᵣ</text><text x="510" y="105" class="text-a">Fₐ</text><text x="557" y="234">F′</text><text x="443" y="326" class="small">F′ = Fₜ tan α</text><!--]--></g><text x="40" y="575" class="asset-footer">教学示意 · 请结合对应章节中的模型假设、单位与适用条件阅读</text></svg>
