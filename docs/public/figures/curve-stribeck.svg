<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="摩擦状态曲线"><title>摩擦状态曲线</title><style>:root{--vp-c-text-1:#203b50;--vp-c-text-2:#526879;--vp-c-text-3:#647b8e;--vp-c-bg:#fff;--vp-c-bg-soft:#f3f7fa;--vp-c-divider:#dbe5ed;--vp-c-brand-1:#176cc4;--vp-c-brand-soft:#dfeaf6;--vp-font-family-base:'PingFang SC','Microsoft YaHei',sans-serif;--vp-font-family-mono:ui-monospace,monospace;color:#203b50} .curve-chart {
  margin: 24px 0;
  padding: 16px 18px 13px;
  overflow: hidden;
  border: 1px solid var(--vp-c-divider);
  border-radius: 14px;
  background: var(--vp-c-bg-soft);
}

.curve-chart header {
  display: flex;
  align-items: baseline;
  gap: 9px;
  margin-bottom: 4px;
}

.curve-chart header span {
  color: var(--vp-c-brand-1);
  font-family: var(--vp-font-family-mono);
  font-size: 8px;
  letter-spacing: 0.1em;
}

.curve-chart header h4 {
  margin: 0;
  color: var(--vp-c-text-1);
  font-size: 13px;
}

svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

.grid path {
  fill: none;
  stroke: var(--vp-c-divider);
  stroke-width: 0.7;
}

.axes path {
  fill: none;
  stroke: var(--vp-c-text-3);
  stroke-width: 1.2;
}

.axes text {
  fill: var(--vp-c-text-3);
  font-family: var(--vp-font-family-mono);
  font-size: 10px;
  letter-spacing: 0.02em;
  stroke: none;
}

.series path {
  fill: none;
}

.curve-main {
  stroke: var(--vp-c-brand-1);
  stroke-width: 2.4;
}

.curve-alt {
  stroke: #d28a1f;
  stroke-width: 1.8;
}

.curve-alt2 {
  stroke: #8a7bd8;
  stroke-width: 1.6;
}

.guide {
  stroke: var(--vp-c-text-3);
  stroke-width: 1;
  opacity: 0.55;
}

.accent-line {
  stroke: #22a06b;
  stroke-width: 1.8;
}

.accent-fill {
  fill: #22a06b;
  stroke: #22a06b;
}

.dot {
  fill: var(--vp-c-brand-1);
  stroke: var(--vp-c-bg-soft);
  stroke-width: 2;
}

.dot-accent {
  fill: #d28a1f;
  stroke: var(--vp-c-bg-soft);
  stroke-width: 2;
}

.small {
  fill: var(--vp-c-text-2);
  font-size: 10px;
  stroke: none;
}

.tag {
  fill: var(--vp-c-brand-1);
  font-family: var(--vp-font-family-mono);
  font-size: 10px;
  font-weight: 700;
  stroke: none;
}

.curve-alt-text {
  fill: #d28a1f;
}

.curve-alt2-text {
  fill: #8a7bd8;
}

.legend text {
  fill: var(--vp-c-text-3);
  font-family: var(--vp-font-family-mono);
  font-size: 8px;
  letter-spacing: 0.1em;
}

figcaption {
  margin-top: 7px;
  color: var(--vp-c-text-3);
  font-size: 11px;
  line-height: 1.6;
}

figcaption em {
  color: var(--vp-c-text-3);
  font-style: normal;
  opacity: 0.8;
}
svg text{font-family:'PingFang SC','Microsoft YaHei',sans-serif} .asset-title{font-size:27px;font-weight:700;fill:#203b50}.asset-footer{font-size:15px;fill:#526879}</style><rect width="1000" height="600" rx="16" fill="white"/><text x="40" y="65" class="asset-title">摩擦状态曲线</text><g class="curve-chart" transform="translate(104 110) scale(1.1)"><g class="grid"><path d="M80 60H680M80 120H680M80 180H680M80 240H680M80 300H680"></path><path d="M140 50V300M260 50V300M380 50V300M500 50V300M620 50V300"></path></g><g class="axes"><path d="M80 300H690M80 300V42"></path><path d="M690 300l-11-5v10zM80 42l-5 11h10z"></path><text x="360" y="340">ηn / p</text><text x="24" y="178" transform="rotate(-90 24 178)">摩擦系数 f</text></g><g class="series"><path d="M100 104C150 116 180 148 230 180C270 205 305 226 345 225C395 223 420 186 470 166C530 142 590 120 660 92" class="curve-main"></path><path d="M290 60V300M430 60V300" class="guide" stroke-dasharray="5 5"></path><path d="M80 225H660" class="guide" stroke-dasharray="3 5"></path><text x="130" y="70" class="small">边界摩擦</text><text x="328" y="70" class="small">混合摩擦</text><text x="520" y="70" class="small">流体摩擦</text><text x="618" y="218" class="small">fmin</text><text x="120" y="84" class="tag">f 高</text></g><g class="legend"><text x="80" y="28">STRIBECK CURVE</text><text x="630" y="28">SCHEMATIC</text></g></g><text x="40" y="575" class="asset-footer">教学示意 · 请结合对应章节中的模型假设、单位与适用条件阅读</text></svg>
