<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="蜗杆受力图解"><title>蜗杆受力图解</title><style>:root{--vp-c-text-1:#203b50;--vp-c-text-2:#526879;--vp-c-text-3:#647b8e;--vp-c-bg:#fff;--vp-c-bg-soft:#f3f7fa;--vp-c-divider:#dbe5ed;--vp-c-brand-1:#176cc4;--vp-c-brand-soft:#dfeaf6;--vp-font-family-base:'PingFang SC','Microsoft YaHei',sans-serif;--vp-font-family-mono:ui-monospace,monospace;color:#203b50} .force-diagram { --ft: #176cc4; --fr: #b06b0c; --fa: #8353c8; margin: 28px 0; padding: 22px; border: 1px solid var(--vp-c-divider); border-radius: 14px; background: var(--vp-c-bg-soft); }

header > span { color: var(--vp-c-text-3); font: 10px var(--vp-font-family-mono); letter-spacing: .12em; }
.force-diagram header h4 { margin: 6px 0 12px; font-size: 17px; line-height: 1.6; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--vp-c-text-1); font: 15px var(--vp-font-family-base); }
svg .small { fill: var(--vp-c-text-2); font-size: 12px; }
svg .panel-title { font-size: 13px; font-weight: 600; }
.body { fill: var(--vp-c-bg); stroke: var(--vp-c-text-3); stroke-width: 1.3; }
.structure { fill: none; stroke: var(--vp-c-text-3); stroke-width: 1.4; }
.axis, .guide { fill: none; stroke: var(--vp-c-text-3); stroke-width: 1; }
.guide { stroke-dasharray: 5 5; opacity: .7; }
.axis { stroke-dasharray: 10 4 2 4; }
.tangent, .radial, .axial, .normal { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.tangent { stroke: var(--ft); }.radial { stroke: var(--fr); }.axial { stroke: var(--fa); }.normal { stroke: var(--vp-c-text-1); }
.arrow-t, svg .text-t { fill: var(--ft); }.arrow-r, svg .text-r { fill: var(--fr); }.arrow-a, svg .text-a { fill: var(--fa); }.arrow-n, .point { fill: var(--vp-c-text-1); }
.shaft-line { stroke: var(--vp-c-text-2); stroke-width: 7; stroke-linecap: round; }
.moment-area { fill: var(--vp-c-brand-soft); stroke: var(--vp-c-divider); }
.force-relation { padding: 13px 16px; border-radius: 8px; background: var(--vp-c-bg); color: var(--vp-c-brand-1); font: 600 13px/1.9 var(--vp-font-family-mono); }
.force-diagram ol { padding-left: 22px; margin: 16px 0 12px; font-size: 13px; line-height: 1.9; }
.force-diagram li + li { margin-top: 4px; }
figcaption { border-top: 1px solid var(--vp-c-divider); padding-top: 12px; color: var(--vp-c-text-3); font-size: 11px; line-height: 1.8; }
svg text{font-family:'PingFang SC','Microsoft YaHei',sans-serif} .asset-title{font-size:27px;font-weight:700;fill:#203b50}.asset-footer{font-size:15px;fill:#526879}</style><rect width="1000" height="600" rx="16" fill="white"/><text x="40" y="65" class="asset-title">蜗杆受力图解</text><g class="force-diagram" transform="translate(104 110) scale(1.1)"><title id="force-v-0-title">蜗杆与蜗轮：同一对作用力，在两根轴上名称不同</title><desc id="force-v-0-desc">将啮合的两个零件拆开，分别画它们受到的力。 蜗杆轴沿左右方向，蜗轮轴垂直纸面，轴交角为 90°。 左右分力在蜗杆上叫轴向力，在蜗轮上叫圆周力；每对作用力方向相反。 1 为蜗杆，2 为蜗轮；⊙ 出纸面，⊗ 入纸面。箭头是一个工况的方向示例，具体正负仍须结合旋向和转向判断。</desc><defs><!--[--><marker id="force-v-0-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-t"></path></marker><marker id="force-v-0-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-r"></path></marker><marker id="force-v-0-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-a"></path></marker><marker id="force-v-0-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-n"></path></marker><!--]--></defs><!--[--><text x="67" y="32" class="panel-title">① 蜗杆受力（拆开看）</text><rect x="78" y="200" width="248" height="64" rx="15" class="body"></rect><!--[--><path d="M110 202l-22 60" class="structure"></path><path d="M145 202l-22 60" class="structure"></path><path d="M180 202l-22 60" class="structure"></path><path d="M215 202l-22 60" class="structure"></path><path d="M250 202l-22 60" class="structure"></path><path d="M285 202l-22 60" class="structure"></path><!--]--><path d="M42 232H348" class="axis"></path><path d="M205 200H118" class="axial" marker-end="url(#force-v-0-a)"></path><path d="M205 200V258" class="radial" marker-end="url(#force-v-0-r)"></path><circle cx="205" cy="200" r="10" class="tangent"></circle><circle cx="205" cy="200" r="2.8" class="arrow-t"></circle><text x="128" y="184" class="text-a">Fₐ₁</text><text x="219" y="249" class="text-r">Fᵣ₁</text><text x="220" y="188" class="text-t">Fₜ₁ ⊙</text><text x="100" y="301" class="small">蜗杆轴：左右方向</text><text x="439" y="32" class="panel-title">② 蜗轮受力（拆开看）</text><circle cx="520" cy="140" r="70" class="body"></circle><circle cx="520" cy="140" r="19" class="body"></circle><path d="M440 140H600M520 60V218" class="axis"></path><path d="M520 210H620" class="tangent" marker-end="url(#force-v-0-t)"></path><path d="M520 210V152" class="radial" marker-end="url(#force-v-0-r)"></path><circle cx="520" cy="210" r="10" class="axial"></circle><path d="M514 204l12 12M526 204l-12 12" class="axial"></path><text x="567" y="234" class="text-t">Fₜ₂</text><text x="534" y="177" class="text-r">Fᵣ₂</text><text x="443" y="238" class="text-a">Fₐ₂ ⊗</text><text x="434" y="301" class="small">蜗轮轴：垂直纸面</text><text x="146" y="352" class="small">同一颜色表示同类分力；作用力配对需按实际空间方向判断。</text><!--]--></g><text x="40" y="575" class="asset-footer">教学示意 · 请结合对应章节中的模型假设、单位与适用条件阅读</text></svg>
