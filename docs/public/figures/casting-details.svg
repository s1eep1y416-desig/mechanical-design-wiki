 </style><rect width="1000" height="600" rx="16" fill="#fff"/><text x="40" y="30" class="eyebrow" text-anchor="start">MECHANICAL DESIGN · 45 / ENGINEERING FIGURE</text><text x="40" y="70" class="title" text-anchor="start">铸件壁厚、圆角与凸台</text><rect x="55" y="110" width="295" height="385" rx="12" class="panel"></rect><text x="75" y="140" class="subtitle" text-anchor="start">均匀壁厚</text><path d="M120 190h155v185H120v-30h125V220H120Z" class="hatch"></path><text x="75" y="430" class="small" text-anchor="start">减少收缩差异</text><text x="75" y="460" class="small" text-anchor="start">避免局部厚大热节</text><rect x="370" y="110" width="295" height="385" rx="12" class="panel"></rect><text x="390" y="140" class="subtitle" text-anchor="start">转角圆滑过渡</text><path d="M435 190h35v125q0 30 30 30h110v35H470q-35 0-35 -35Z" class="hatch"></path><text x="390" y="430" class="small" text-anchor="start">降低应力集中</text><text x="390" y="460" class="small" text-anchor="start">有利于充型与清理</text><rect x="685" y="110" width="295" height="385" rx="12" class="panel"></rect><text x="705" y="140" class="subtitle" text-anchor="start">凸台与筋合理连接</text><rect x="735" y="345" width="205" height="35" rx="3" class="hatch"></rect><rect x="795" y="210" width="70" height="135" rx="3" class="hatch"></rect><path d="M760 345l35 -70v70Z M865 345v-70l40 70Z" class="metal"></path><text x="705" y="430" class="small" text-anchor="start">保证连接刚度</text><text x="705" y="460" class="small" text-anchor="start">兼顾壁厚与冷却</text><line x1="40" y1="550" x2="960" y2="550" class="guide"></line><text x="40" y="580" class="footer" text-anchor="start">独立绘制 · 教学示意 · 细节与比例以图下注释为准</text><text x="960" y="580" class="footer" text-anchor="end">casting-details</text></svg>
