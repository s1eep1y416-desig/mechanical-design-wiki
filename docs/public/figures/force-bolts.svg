<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="螺栓组受力图解"><title>螺栓组受力图解</title><style>:root{--vp-c-text-1:#203b50;--vp-c-text-2:#526879;--vp-c-text-3:#647b8e;--vp-c-bg:#fff;--vp-c-bg-soft:#f3f7fa;--vp-c-divider:#dbe5ed;--vp-c-brand-1:#176cc4;--vp-c-brand-soft:#dfeaf6;--vp-font-family-base:'PingFang SC','Microsoft YaHei',sans-serif;--vp-font-family-mono:ui-monospace,monospace;color:#203b50} .force-diagram { --ft: #176cc4; --fr: #b06b0c; --fa: #8353c8; margin: 28px 0; padding: 22px; border: 1px solid var(--vp-c-divider); border-radius: 14px; background: var(--vp-c-bg-soft); }

header > span { color: var(--vp-c-text-3); font: 10px var(--vp-font-family-mono); letter-spacing: .12em; }
.force-diagram header h4 { margin: 6px 0 12px; font-size: 17px; line-height: 1.6; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--vp-c-text-1); font: 15px var(--vp-font-family-base); }
svg .small { fill: var(--vp-c-text-2); font-size: 12px; }
svg .panel-title { font-size: 13px; font-weight: 600; }
.body { fill: var(--vp-c-bg); stroke: var(--vp-c-text-3); stroke-width: 1.3; }
.structure { fill: none; stroke: var(--vp-c-text-3); stroke-width: 1.4; }
.axis, .guide { fill: none; stroke: var(--vp-c-text-3); stroke-width: 1; }
.guide { stroke-dasharray: 5 5; opacity: .7; }
.axis { stroke-dasharray: 10 4 2 4; }
.tangent, .radial, .axial, .normal { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.tangent { stroke: var(--ft); }.radial { stroke: var(--fr); }.axial { stroke: var(--fa); }.normal { stroke: var(--vp-c-text-1); }
.arrow-t, svg .text-t { fill: var(--ft); }.arrow-r, svg .text-r { fill: var(--fr); }.arrow-a, svg .text-a { fill: var(--fa); }.arrow-n, .point { fill: var(--vp-c-text-1); }
.shaft-line { stroke: var(--vp-c-text-2); stroke-width: 7; stroke-linecap: round; }
.moment-area { fill: var(--vp-c-brand-soft); stroke: var(--vp-c-divider); }
.force-relation { padding: 13px 16px; border-radius: 8px; background: var(--vp-c-bg); color: var(--vp-c-brand-1); font: 600 13px/1.9 var(--vp-font-family-mono); }
.force-diagram ol { padding-left: 22px; margin: 16px 0 12px; font-size: 13px; line-height: 1.9; }
.force-diagram li + li { margin-top: 4px; }
figcaption { border-top: 1px solid var(--vp-c-divider); padding-top: 12px; color: var(--vp-c-text-3); font-size: 11px; line-height: 1.8; }
svg text{font-family:'PingFang SC','Microsoft YaHei',sans-serif} .asset-title{font-size:27px;font-weight:700;fill:#203b50}.asset-footer{font-size:15px;fill:#526879}</style><rect width="1000" height="600" rx="16" fill="white"/><text x="40" y="65" class="asset-title">螺栓组受力图解</text><g class="force-diagram" transform="translate(104 110) scale(1.1)"><title id="force-v-0-title">螺栓组受转矩：各螺栓沿绕形心圆的切线方向受力</title><desc id="force-v-0-desc">先找到螺栓组形心 O，再量各螺栓到 O 的距离 rᵢ。 图中画连接板受到螺栓的反力，力矩方向抵抗外加顺时针转矩 T。 半径越大，分配到的力越大；本图四个螺栓半径相同，因此受力相同。 铰制孔螺栓承剪的弹性简化模型，板视为刚性、各螺栓剪切刚度相同。普通预紧螺栓靠接合面摩擦传力，应另作防滑校核。</desc><defs><!--[--><marker id="force-v-0-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-t"></path></marker><marker id="force-v-0-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-r"></path></marker><marker id="force-v-0-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-a"></path></marker><marker id="force-v-0-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-n"></path></marker><!--]--></defs><!--[--><text x="59" y="32" class="panel-title">① 连接板的平面受力</text><rect x="96" y="79" width="220" height="220" rx="14" class="body"></rect><path d="M206 64V314M80 189H330" class="axis"></path><!--[--><g><circle cx="151" cy="134" r="12" class="body"></circle><path d="M151 134l-38.5 38.5" class="tangent" marker-end="url(#force-v-0-t)"></path></g><g><circle cx="261" cy="134" r="12" class="body"></circle><path d="M261 134l-38.5 -38.5" class="tangent" marker-end="url(#force-v-0-t)"></path></g><g><circle cx="261" cy="244" r="12" class="body"></circle><path d="M261 244l38.5 -38.5" class="tangent" marker-end="url(#force-v-0-t)"></path></g><g><circle cx="151" cy="244" r="12" class="body"></circle><path d="M151 244l38.5 38.5" class="tangent" marker-end="url(#force-v-0-t)"></path></g><!--]--><path d="M206 189 261 134" class="guide"></path><text x="218" y="156" class="small">rᵢ</text><text x="211" y="208">O</text><text x="220" y="88" class="text-t">Fᵢ</text><path d="M345 154A145 145 0 0 1 315 283" class="axial" marker-end="url(#force-v-0-a)"></path><text x="358" y="217" class="text-a">T ↻</text><text x="60" y="349" class="small">板受螺栓反力 ↺　螺栓受板的力反向</text><text x="432" y="32" class="panel-title">② 平衡与分配</text><text x="429" y="119">各力方向：垂直 O 到螺栓的连线</text><text x="429" y="165">分配规律：Fᵢ ∝ rᵢ</text><text x="429" y="211">力矩平衡：ΣFᵢrᵢ = T</text><text x="429" y="257">同一圆周上：Fᵢ = T / (zr)</text><text x="429" y="320" class="small">z 为螺栓数量，r 为共同半径</text><!--]--></g><text x="40" y="575" class="asset-footer">教学示意 · 请结合对应章节中的模型假设、单位与适用条件阅读</text></svg>
