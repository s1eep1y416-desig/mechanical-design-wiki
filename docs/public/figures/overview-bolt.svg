 </style><rect width="1000" height="600" rx="16" fill="#fff"/><text x="40" y="30" class="eyebrow" text-anchor="start">MECHANICAL DESIGN · 55 / ENGINEERING FIGURE</text><text x="40" y="70" class="title" text-anchor="start">预紧螺栓的装配与受力</text><rect x="55" y="95" width="440" height="400" rx="12" class="panel"></rect><text x="75" y="125" class="subtitle" text-anchor="start">剖面：拧紧后夹紧连接件</text><rect x="155" y="205" width="240" height="80" rx="3" class="hatch"></rect><rect x="155" y="285" width="240" height="80" rx="3" class="hatch2"></rect><rect x="252" y="165" width="46" height="230" rx="3" class="paper"></rect><g transform="translate(275 190) scale(1)"><rect x="-16" y="0" width="32" height="200" rx="3" class="steel"></rect><path d="M-30 0v-20h60V0Z" class="metal"></path><rect x="-28" y="175" width="56" height="25" rx="3" class="metal"></rect><line x1="-16" y1="165" x2="16" y2="157" class="fine"></line><line x1="-16" y1="170" x2="16" y2="162" class="fine"></line><line x1="-16" y1="175" x2="16" y2="167" class="fine"></line><line x1="-16" y1="180" x2="16" y2="172" class="fine"></line><line x1="-16" y1="185" x2="16" y2="177" class="fine"></line><line x1="-16" y1="190" x2="16" y2="182" class="fine"></line><line x1="-16" y1="195" x2="16" y2="187" class="fine"></line><line x1="0" y1="-40" x2="0" y2="220" class="axis"></line></g><line x1="170" y1="195" x2="170" y2="260" class="force" marker-end="url(#arrow)"></line><text x="179" y="217.5" class="small" text-anchor="start">压紧</text><line x1="170" y1="390" x2="170" y2="320" class="force" marker-end="url(#arrow)"></line><rect x="525" y="95" width="420" height="400" rx="12" class="panel"></rect><text x="545" y="125" class="subtitle" text-anchor="start">工作载荷的分配</text><line x1="695" y1="270" x2="695" y2="155" class="force" marker-end="url(#arrow)"></line><text x="704" y="202.5" class="small" text-anchor="start">螺栓 F₂</text><rect x="655" y="270" width="80" height="25" rx="3" class="steel"></rect><line x1="625" y1="295" x2="625" y2="395" class="force" marker-end="url(#arrow)"></line><text x="634" y="335" class="small" text-anchor="start">剩余夹紧力 F₁</text><line x1="790" y1="295" x2="790" y2="395" class="force" marker-end="url(#arrow)"></line><text x="799" y="335" class="small" text-anchor="start">外载 F</text><text x="565" y="435" class="small" text-anchor="start">F₂ = F₀ + CF</text><text x="565" y="465" class="small" text-anchor="start">F₁ = F₀ − (1−C)F；未分离时成立</text><line x1="40" y1="550" x2="960" y2="550" class="guide"></line><text x="40" y="580" class="footer" text-anchor="start">独立绘制 · 教学示意 · 细节与比例以图下注释为准</text><text x="960" y="580" class="footer" text-anchor="end">overview-bolt</text></svg>
