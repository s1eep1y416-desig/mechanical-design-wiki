 </style><rect width="1000" height="600" rx="16" fill="#fff"/><text x="40" y="30" class="eyebrow" text-anchor="start">MECHANICAL DESIGN · 24 / ENGINEERING FIGURE</text><text x="40" y="70" class="title" text-anchor="start">带传动的张紧调整</text><circle cx="240" cy="260" r="90" class="steel"></circle><circle cx="660" cy="260" r="130" class="steel"></circle><circle cx="240" cy="260" r="25" class="paper"></circle><circle cx="660" cy="260" r="35" class="paper"></circle><path d="M231 170L648 131A130 130 0 1 1 648 389L231 350A90 90 0 0 1 231 170Z" class="belt"></path><rect x="110" y="375" width="275" height="45" rx="3" class="hatch"></rect><rect x="140" y="388" width="210" height="15" rx="7" class="dark"></rect><circle cx="170" cy="396" r="13" class="gold"></circle><circle cx="310" cy="396" r="13" class="gold"></circle><line x1="175" y1="455" x2="320" y2="455" class="force" marker-end="url(#arrow)"></line><text x="256.5" y="445" class="small" text-anchor="start">底座沿滑槽平移</text><line x1="240" y1="110" x2="660" y2="110" class="dimension" marker-start="url(#dim)" marker-end="url(#dim)"></line><text x="450" y="100" class="small" text-anchor="middle">中心距 a 可调</text><text x="560" y="475" class="small" text-anchor="start">停机调节 → 复核张紧力 → 锁紧底座</text><line x1="40" y1="550" x2="960" y2="550" class="guide"></line><text x="40" y="580" class="footer" text-anchor="start">独立绘制 · 教学示意 · 细节与比例以图下注释为准</text><text x="960" y="580" class="footer" text-anchor="end">belt-tensioner</text></svg>
