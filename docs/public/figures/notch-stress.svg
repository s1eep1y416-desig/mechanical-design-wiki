 </style><rect width="1000" height="600" rx="16" fill="#fff"/><text x="40" y="30" class="eyebrow" text-anchor="start">MECHANICAL DESIGN · 09 / ENGINEERING FIGURE</text><text x="40" y="70" class="title" text-anchor="start">轴肩与缺口的应力集中</text><rect x="65" y="105" width="440" height="390" rx="12" class="panel"></rect><text x="85" y="135" class="subtitle" text-anchor="start">尖锐轴肩</text><path d="M110 235h110v-30h30h160v150H250v-30h-30H110Z" class="steel"></path><path d="M115 250C225 250 215 218 405 220" class="stress"></path><path d="M115 265C225 265 215 241 405 243" class="stress"></path><path d="M115 280C225 280 215 264 405 266" class="stress"></path><path d="M115 295C225 295 215 287 405 289" class="stress"></path><path d="M115 310C225 310 215 310 405 312" class="stress"></path><path d="M115 325C225 325 215 333 405 335" class="stress"></path><line x1="75" y1="280" x2="110" y2="280" class="force" marker-end="url(#arrow)"></line><line x1="415" y1="280" x2="480" y2="280" class="force" marker-end="url(#arrow)"></line><text x="90" y="435" class="small" text-anchor="start">截面突变，局部应力增大</text><text x="90" y="465" class="small" text-anchor="start">彩色线仅表示应力流趋势，非有限元结果</text><rect x="540" y="105" width="440" height="390" rx="12" class="panel"></rect><text x="560" y="135" class="subtitle" text-anchor="start">圆角过渡</text><path d="M585 235h110q30 0 30 -30h160v150H725q0 -30 -30 -30H585Z" class="steel"></path><path d="M590 250C700 250 690 218 880 220" class="stress"></path><path d="M590 265C700 265 690 241 880 243" class="stress"></path><path d="M590 280C700 280 690 264 880 266" class="stress"></path><path d="M590 295C700 295 690 287 880 289" class="stress"></path><path d="M590 310C700 310 690 310 880 312" class="stress"></path><path d="M590 325C700 325 690 333 880 335" class="stress"></path><line x1="550" y1="280" x2="585" y2="280" class="force" marker-end="url(#arrow)"></line><line x1="890" y1="280" x2="955" y2="280" class="force" marker-end="url(#arrow)"></line><text x="565" y="435" class="small" text-anchor="start">过渡平缓，局部峰值通常降低</text><text x="565" y="465" class="small" text-anchor="start">彩色线仅表示应力流趋势，非有限元结果</text><line x1="40" y1="550" x2="960" y2="550" class="guide"></line><text x="40" y="580" class="footer" text-anchor="start">独立绘制 · 教学示意 · 细节与比例以图下注释为准</text><text x="960" y="580" class="footer" text-anchor="end">notch-stress</text></svg>
