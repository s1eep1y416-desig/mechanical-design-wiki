<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">铆接接头的剪切与挤压</title><desc id="desc">铆钉杆在搭接面受剪，孔壁承受挤压；板边距离不足还会引起撕裂。</desc><defs>
