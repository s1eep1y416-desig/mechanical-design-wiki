 </style><rect width="1000" height="600" rx="16" fill="#fff"/><text x="40" y="30" class="eyebrow" text-anchor="start">MECHANICAL DESIGN · 51 / ENGINEERING FIGURE</text><text x="40" y="70" class="title" text-anchor="start">表面硬化层与韧性心部</text><rect x="65" y="110" width="435" height="390" rx="12" class="panel"></rect><text x="85" y="140" class="subtitle" text-anchor="start">渗碳淬火：表面富碳后淬硬</text><circle cx="190" cy="270" r="80" class="gold"></circle><circle cx="190" cy="270" r="62" class="steel"></circle><line x1="310" y1="375" x2="455" y2="375" class="axis"></line><line x1="310" y1="375" x2="310" y2="190" class="axis"></line><path d="M315 210C355 210 355 330 410 330H450" class="force"></path><text x="310" y="170" class="small" text-anchor="start">硬度</text><text x="335" y="410" class="small" text-anchor="start">距表面深度</text><text x="90" y="455" class="small" text-anchor="start">硬化表层承载，心部保留所需韧性</text><rect x="535" y="110" width="435" height="390" rx="12" class="panel"></rect><text x="555" y="140" class="subtitle" text-anchor="start">感应淬火：局部加热淬硬</text><circle cx="660" cy="270" r="80" class="gold"></circle><circle cx="660" cy="270" r="62" class="steel"></circle><line x1="780" y1="375" x2="925" y2="375" class="axis"></line><line x1="780" y1="375" x2="780" y2="190" class="axis"></line><path d="M785 210C825 210 825 330 880 330H920" class="force"></path><text x="780" y="170" class="small" text-anchor="start">硬度</text><text x="805" y="410" class="small" text-anchor="start">距表面深度</text><text x="560" y="455" class="small" text-anchor="start">表面组织改变，碳含量不因此增加</text><line x1="40" y1="550" x2="960" y2="550" class="guide"></line><text x="40" y="580" class="footer" text-anchor="start">独立绘制 · 教学示意 · 细节与比例以图下注释为准</text><text x="960" y="580" class="footer" text-anchor="end">heat-treatment</text></svg>
