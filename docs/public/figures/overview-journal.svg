 </style><rect width="1000" height="600" rx="16" fill="#fff"/><text x="40" y="30" class="eyebrow" text-anchor="start">MECHANICAL DESIGN · 58 / ENGINEERING FIGURE</text><text x="40" y="70" class="title" text-anchor="start">滑动轴承与偏心油膜</text><rect x="110" y="115" width="370" height="350" rx="3" class="hatch"></rect><circle cx="295" cy="285" r="145" class="gold"></circle><circle cx="295" cy="285" r="122" class="oil"></circle><circle cx="310" cy="302" r="98" class="steel"></circle><circle cx="295" cy="285" r="4" class="red"></circle><circle cx="310" cy="302" r="4" class="red"></circle><line x1="145" y1="285" x2="450" y2="285" class="axis"></line><line x1="310" y1="240" x2="310" y2="340" class="force" marker-end="url(#arrow)"></line><text x="319" y="280" class="small" text-anchor="start">载荷 W</text><circle cx="224" cy="380" r="3" class="red"></circle><path d="M224 380L530 400h16" class="guide"></path><text x="550" y="405" class="small" text-anchor="start">薄油膜区 hmin（夸大）</text><circle cx="295" cy="285" r="3" class="red"></circle><path d="M295 285L545 170h16" class="guide"></path><text x="565" y="175" class="small" text-anchor="start">轴瓦中心 O</text><circle cx="310" cy="302" r="3" class="red"></circle><path d="M310 302L545 230h16" class="guide"></path><text x="565" y="235" class="small" text-anchor="start">轴颈中心 O₁</text><text x="580" y="300" class="small" text-anchor="start">偏心距 e = OO₁</text><text x="580" y="330" class="small" text-anchor="start">径向间隙 c = R − r</text><text x="580" y="360" class="small" text-anchor="start">偏心率 ε = e/c &lt; 1</text><line x1="40" y1="550" x2="960" y2="550" class="guide"></line><text x="40" y="580" class="footer" text-anchor="start">独立绘制 · 教学示意 · 细节与比例以图下注释为准</text><text x="960" y="580" class="footer" text-anchor="end">overview-journal</text></svg>
