 </style><rect width="1000" height="600" rx="16" fill="#fff"/><text x="40" y="30" class="eyebrow" text-anchor="start">MECHANICAL DESIGN · 28 / ENGINEERING FIGURE</text><text x="40" y="70" class="title" text-anchor="start">轮齿弯曲、点蚀与胶合</text><rect x="55" y="110" width="295" height="385" rx="12" class="panel"></rect><text x="75" y="140" class="subtitle" text-anchor="start">齿根弯曲疲劳</text><g transform="translate(105 220) scale(1)"><path d="M0 150V105Q45 94 52 20L70 0H120L138 20Q146 95 190 105V150Z" class="hatch"></path></g><path d="M145 319l18 -8 8 8 10 -6" class="force"></path><line x1="255" y1="225" x2="220" y2="265" class="force" marker-end="url(#arrow)"></line><text x="246.5" y="235" class="small" text-anchor="start">Fn</text><text x="75" y="430" class="small" text-anchor="start">危险区在齿根过渡附近</text><text x="75" y="460" class="small" text-anchor="start">交变弯曲使裂纹扩展</text><rect x="370" y="110" width="295" height="385" rx="12" class="panel"></rect><text x="390" y="140" class="subtitle" text-anchor="start">齿面点蚀</text><g transform="translate(420 220) scale(1)"><path d="M0 150V105Q45 94 52 20L70 0H120L138 20Q146 95 190 105V150Z" class="hatch"></path></g><circle cx="490" cy="260" r="3" class="pit"></circle><circle cx="503" cy="277" r="4" class="pit"></circle><circle cx="516" cy="294" r="5" class="pit"></circle><circle cx="529" cy="275" r="3" class="pit"></circle><circle cx="494" cy="292" r="4" class="pit"></circle><circle cx="507" cy="273" r="5" class="pit"></circle><circle cx="520" cy="290" r="3" class="pit"></circle><circle cx="533" cy="271" r="4" class="pit"></circle><circle cx="498" cy="288" r="5" class="pit"></circle><circle cx="511" cy="269" r="3" class="pit"></circle><circle cx="524" cy="286" r="4" class="pit"></circle><text x="390" y="430" class="small" text-anchor="start">反复接触形成小坑</text><text x="390" y="460" class="small" text-anchor="start">还应区分正常磨合与损伤</text><rect x="685" y="110" width="295" height="385" rx="12" class="panel"></rect><text x="705" y="140" class="subtitle" text-anchor="start">齿面胶合</text><g transform="translate(735 220) scale(1)"><path d="M0 150V105Q45 94 52 20L70 0H120L138 20Q146 95 190 105V150Z" class="hatch"></path></g><path d="M797 250l-4 45" class="scratch"></path><path d="M805 250l-4 45" class="scratch"></path><path d="M813 250l-4 45" class="scratch"></path><path d="M821 250l-4 45" class="scratch"></path><path d="M829 250l-4 45" class="scratch"></path><path d="M837 250l-4 45" class="scratch"></path><path d="M845 250l-4 45" class="scratch"></path><text x="705" y="430" class="small" text-anchor="start">高滑动、高温与润滑失效</text><text x="705" y="460" class="small" text-anchor="start">形成沿滑动方向的擦伤</text><line x1="40" y1="550" x2="960" y2="550" class="guide"></line><text x="40" y="580" class="footer" text-anchor="start">独立绘制 · 教学示意 · 细节与比例以图下注释为准</text><text x="960" y="580" class="footer" text-anchor="end">gear-failures</text></svg>
