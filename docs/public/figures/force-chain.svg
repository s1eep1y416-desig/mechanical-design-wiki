<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="链传动图解"><title>链传动图解</title><style>:root{--vp-c-text-1:#203b50;--vp-c-text-2:#526879;--vp-c-text-3:#647b8e;--vp-c-bg:#fff;--vp-c-bg-soft:#f3f7fa;--vp-c-divider:#dbe5ed;--vp-c-brand-1:#176cc4;--vp-c-brand-soft:#dfeaf6;--vp-font-family-base:'PingFang SC','Microsoft YaHei',sans-serif;--vp-font-family-mono:ui-monospace,monospace;color:#203b50} .force-diagram { --ft: #176cc4; --fr: #b06b0c; --fa: #8353c8; margin: 28px 0; padding: 22px; border: 1px solid var(--vp-c-divider); border-radius: 14px; background: var(--vp-c-bg-soft); }

header > span { color: var(--vp-c-text-3); font: 10px var(--vp-font-family-mono); letter-spacing: .12em; }
.force-diagram header h4 { margin: 6px 0 12px; font-size: 17px; line-height: 1.6; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--vp-c-text-1); font: 15px var(--vp-font-family-base); }
svg .small { fill: var(--vp-c-text-2); font-size: 12px; }
svg .panel-title { font-size: 13px; font-weight: 600; }
.body { fill: var(--vp-c-bg); stroke: var(--vp-c-text-3); stroke-width: 1.3; }
.structure { fill: none; stroke: var(--vp-c-text-3); stroke-width: 1.4; }
.axis, .guide { fill: none; stroke: var(--vp-c-text-3); stroke-width: 1; }
.guide { stroke-dasharray: 5 5; opacity: .7; }
.axis { stroke-dasharray: 10 4 2 4; }
.tangent, .radial, .axial, .normal { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.tangent { stroke: var(--ft); }.radial { stroke: var(--fr); }.axial { stroke: var(--fa); }.normal { stroke: var(--vp-c-text-1); }
.arrow-t, svg .text-t { fill: var(--ft); }.arrow-r, svg .text-r { fill: var(--fr); }.arrow-a, svg .text-a { fill: var(--fa); }.arrow-n, .point { fill: var(--vp-c-text-1); }
.shaft-line { stroke: var(--vp-c-text-2); stroke-width: 7; stroke-linecap: round; }
.moment-area { fill: var(--vp-c-brand-soft); stroke: var(--vp-c-divider); }
.force-relation { padding: 13px 16px; border-radius: 8px; background: var(--vp-c-bg); color: var(--vp-c-brand-1); font: 600 13px/1.9 var(--vp-font-family-mono); }
.force-diagram ol { padding-left: 22px; margin: 16px 0 12px; font-size: 13px; line-height: 1.9; }
.force-diagram li + li { margin-top: 4px; }
figcaption { border-top: 1px solid var(--vp-c-divider); padding-top: 12px; color: var(--vp-c-text-3); font-size: 11px; line-height: 1.8; }
svg text{font-family:'PingFang SC','Microsoft YaHei',sans-serif} .asset-title{font-size:27px;font-weight:700;fill:#203b50}.asset-footer{font-size:15px;fill:#526879}</style><rect width="1000" height="600" rx="16" fill="white"/><text x="40" y="65" class="asset-title">链传动图解</text><g class="force-diagram" transform="translate(104 110) scale(1.1)"><title id="force-v-0-title">链轮：紧边传力，松边仍然存在张力</title><desc id="force-v-0-desc">图示为顺时针主动链轮，下边为紧边，上边为松边。 有效拉力对应两边张力的差；松边张力不能直接当作零。 轴载荷由链条两边的拉力矢量合成，不能只取有效拉力 Fₑ。 平行链边、准静态简化示意。Fc 为离心拉力，Ff 为悬垂拉力；实际还需考虑动载荷和布置角度。</desc><defs><!--[--><marker id="force-v-0-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-t"></path></marker><marker id="force-v-0-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-r"></path></marker><marker id="force-v-0-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-a"></path></marker><marker id="force-v-0-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" class="arrow-n"></path></marker><!--]--></defs><!--[--><text x="64" y="32" class="panel-title">① 主动轮的受力简图</text><path d="M229.660 179.528 L233.071 179.260 L234.481 179.334 L235.903 179.566 L237.330 179.906 L238.760 180.338 L240.191 180.853 L241.622 181.444 L243.049 182.107 L244.472 182.841 A84.5 84.5 0 0 1 244.472 187.159 L244.472 187.159 L243.049 187.893 L241.622 188.556 L240.191 189.147 L238.760 189.662 L237.330 190.094 L235.903 190.434 L234.481 190.666 L233.071 190.740 L229.660 190.472 A69.875 69.875 0 0 1 228.703 197.744 L228.703 197.744 L232.067 198.368 L233.410 198.805 L234.723 199.397 L236.013 200.094 L237.283 200.882 L238.532 201.749 L239.761 202.690 L240.968 203.701 L242.153 204.777 A84.5 84.5 0 0 1 241.035 208.949 L