 </style><rect width="1000" height="600" rx="16" fill="#fff"/><text x="40" y="30" class="eyebrow" text-anchor="start">MECHANICAL DESIGN · 50 / ENGINEERING FIGURE</text><text x="40" y="70" class="title" text-anchor="start">表面涂层与基体的分工</text><rect x="55" y="110" width="295" height="385" rx="12" class="panel"></rect><text x="75" y="140" class="subtitle" text-anchor="start">电镀：沉积金属层</text><rect x="85" y="285" width="235" height="90" rx="3" class="steel"></rect><rect x="85" y="250" width="235" height="35" rx="3" class="gold"></rect><circle cx="165" cy="270" r="3" class="red"></circle><path d="M165 270L95 205h16" class="guide"></path><text x="115" y="210" class="small" text-anchor="start">表层（厚度放大）</text><text x="75" y="425" class="small" text-anchor="start">耐蚀 / 耐磨 / 装饰</text><text x="75" y="455" class="small" text-anchor="start">基体、前处理与镀层共同决定性能</text><rect x="370" y="110" width="295" height="385" rx="12" class="panel"></rect><text x="390" y="140" class="subtitle" text-anchor="start">涂装：附着涂膜</text><rect x="400" y="285" width="235" height="90" rx="3" class="steel"></rect><rect x="400" y="250" width="235" height="35" rx="3" class="blue"></rect><circle cx="480" cy="270" r="3" class="red"></circle><path d="M480 270L410 205h16" class="guide"></path><text x="430" y="210" class="small" text-anchor="start">表层（厚度放大）</text><text x="390" y="425" class="small" text-anchor="start">阻隔环境介质</text><text x="390" y="455" class="small" text-anchor="start">附着与涂层完整性影响寿命</text><rect x="685" y="110" width="295" height="385" rx="12" class="panel"></rect><text x="705" y="140" class="subtitle" text-anchor="start">阳极氧化：转化膜</text><rect x="715" y="285" width="235" height="90" rx="3" class="steel"></rect><rect x="715" y="250" width="235" height="35" rx="3" class="hatch"></rect><line x1="725" y1="250" x2="725" y2="275" class="paperline"></line><line x1="743" y1="250" x2="743" y2="275" class="paperline"></line><line x1="761" y1="250" x2="761" y2="275" class="paperline"></line><line x1="779" y1="250" x2="779" y2="275" class="paperline"></line><line x1="797" y1="250" x2="797" y2="275" class="paperline"></line><line x1="815" y1="250" x2="815" y2="275" class="paperline"></line><line x1="833" y1="250" x2="833" y2="275" class="paperline"></line><line x1="851" y1="250" x2="851" y2="275" class="paperline"></line><line x1="869" y1="250" x2="869" y2="275" class="paperline"></line><line x1="887" y1="250" x2="887" y2="275" class="paperline"></line><line x1="905" y1="250" x2="905" y2="275" class="paperline"></line><line x1="923" y1="250" x2="923" y2="275" class="paperline"></line><circle cx="795" cy="270" r="3" class="red"></circle><path d="M795 270L725 205h16" class="guide"></path><text x="745" y="210" class="small" text-anchor="start">表层（厚度放大）</text><text x="705" y="425" class="small" text-anchor="start">如铝合金的氧化膜</text><text x="705" y="455" class="small" text-anchor="start">膜层与基体有转化生长关系</text><line x1="40" y1="550" x2="960" y2="550" class="guide"></line><text x="40" y="580" class="footer" text-anchor="start">独立绘制 · 教学示意 · 细节与比例以图下注释为准</text><text x="960" y="580" class="footer" text-anchor="end">surface-coatings</text></svg>
