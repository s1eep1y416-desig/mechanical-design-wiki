 </style><rect width="1000" height="600" rx="16" fill="#fff"/><text x="40" y="30" class="eyebrow" text-anchor="start">MECHANICAL DESIGN · 06 / ENGINEERING FIGURE</text><text x="40" y="70" class="title" text-anchor="start">强度、刚度与稳定性</text><rect x="50" y="110" width="290" height="385" rx="12" class="panel"></rect><text x="70" y="140" class="subtitle" text-anchor="start">强度：是否破坏</text><rect x="75" y="270" width="240" height="30" rx="3" class="steel"></rect><path d="M85 300l-20 32h40Z" class="hatch"></path><line x1="52" y1="338" x2="118" y2="338" class="ink"></line><path d="M305 300l-20 32h40Z" class="hatch"></path><line x1="272" y1="338" x2="338" y2="338" class="ink"></line><line x1="195" y1="180" x2="195" y2="265" class="force" marker-end="url(#arrow)"></line><text x="204" y="212.5" class="small" text-anchor="start">F</text><path d="M195 270l-8 12 15 8-8 10" class="force"></path><text x="70" y="455" class="small" text-anchor="start">σ ≤ [σ]</text><rect x="365" y="110" width="290" height="385" rx="12" class="panel"></rect><text x="385" y="140" class="subtitle" text-anchor="start">刚度：变形是否过大</text><rect x="390" y="270" width="240" height="30" rx="3" class="steel"></rect><path d="M400 300l-20 32h40Z" class="hatch"></path><line x1="367" y1="338" x2="433" y2="338" class="ink"></line><path d="M620 300l-20 32h40Z" class="hatch"></path><line x1="587" y1="338" x2="653" y2="338" class="ink"></line><line x1="510" y1="180" x2="510" y2="265" class="force" marker-end="url(#arrow)"></line><text x="519" y="212.5" class="small" text-anchor="start">F</text><path d="M395 305Q510 365 625 305" class="force"></path><text x="385" y="455" class="small" text-anchor="start">y ≤ [y]，θ ≤ [θ]</text><rect x="680" y="110" width="290" height="385" rx="12" class="panel"></rect><text x="700" y="140" class="subtitle" text-anchor="start">稳定性：是否失稳</text><line x1="825" y1="205" x2="825" y2="375" class="axis"></line><path d="M825 205Q915 290 825 375" class="coil"></path><path d="M825 375l-20 32h40Z" class="