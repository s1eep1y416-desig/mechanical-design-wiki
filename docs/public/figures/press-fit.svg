xt x="565" y="185" class="small" text-anchor="start">接触直径 d，配合长度 l</text><text x="565" y="215" class="small" text-anchor="start">接触面积 A = πdl</text><text x="565" y="245" class="small" text-anchor="start">均匀压力近似：</text><text x="565" y="275" class="small" text-anchor="start">T ≤ μp(πdl)·d/2</text><text x="565" y="305" class="small" text-anchor="start">轴向承载：F ≤ μpπdl</text><text x="565" y="335" class="small" text-anchor="start">同时承受转矩与轴向力时需联合校核。</text><text x="220" y="485" class="small" text-anchor="start">箭头：轮毂作用于轴的压力</text><line x1="40" y1="550" x2="960" y2="550" class="guide"></line><text x="40" y="580" class="footer" text-anchor="start">独立绘制 · 教学示意 · 细节与比例以图下注释为准</text><text x="960" y="580" class="footer" text-anchor="end">press-fit</text></svg>
